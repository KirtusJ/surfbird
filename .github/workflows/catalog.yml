name: Catalogue
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Take the catalogue check from pcp-os at the pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KirtusJ/pcp-os
          ref: 391efc8f724b7857ab9fd6dccbf14a885e4d09ec
          path: .pcp-os-check
          sparse-checkout: build/check_catalog.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The catalogue is the tree, checked links hold, no session context
        run: python3 tests/check_catalog.py .pcp-os-check/build/check_catalog.py
