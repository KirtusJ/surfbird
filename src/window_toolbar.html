<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<style>
  * { box-sizing: border-box }
  body { margin: 0; color: #152e38; background: #edf3f3; font: 14px "Segoe UI", sans-serif }
  form { height: 44px; padding: 6px 8px; display: flex; align-items: stretch; gap: 5px }
  button, input { font: inherit; color: inherit; border: 1px solid #9eb5b7; border-radius: 5px; background: white }
  button { min-width: 34px; cursor: pointer; padding: 0 8px }
  input { min-width: 20px; flex: 1; padding: 0 9px }
  :focus-visible { outline: 2px solid #00746f; outline-offset: -2px }
</style>
<form aria-label="Navigation">
  <button type="button" data-command="back" aria-label="Back" title="Back">←</button>
  <button type="button" data-command="forward" aria-label="Forward" title="Forward">→</button>
  <button type="button" data-command="reload" aria-label="Reload" title="Reload">↻</button>
  <input id="address" aria-label="Web address" type="url" required placeholder="https://" spellcheck="false">
  <button type="submit">Go</button>
</form>
<script>
  const address = document.querySelector('#address');
  let current = '';
  window.showLocation = url => {
    if (url !== current || document.activeElement !== address) address.value = url;
    current = url;
  };
  address.addEventListener('focus', () => address.select());
  address.addEventListener('blur', event => {
    if (event.relatedTarget !== document.querySelector('button[type="submit"]'))
      address.value = current;
  });
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    try {
      const url = new URL(address.value);
      if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password)
        throw new Error();
      window.ipc.postMessage(url.href);
      address.blur();
    } catch {
      address.setCustomValidity('Enter an HTTP or HTTPS address without account credentials.');
      address.reportValidity();
    }
  });
  address.addEventListener('input', () => address.setCustomValidity(''));
  for (const button of document.querySelectorAll('[data-command]'))
    button.onclick = () => window.ipc.postMessage(button.dataset.command);
  window.ipc.postMessage('ready');
</script>
</html>
